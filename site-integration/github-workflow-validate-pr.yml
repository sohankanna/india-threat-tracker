# Copy this to .github/workflows/validate-pr.yml in the repo root.
# (The file-bridge can't write under .github/, so it's staged here.)
name: Validate data + detections

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-ci.txt

      - name: Validate data feeds against schemas
        run: python scripts/validate.py

      - name: Detection inventory + YAML/XML parse
        run: python scripts/check_inventory.py

      - name: Validate Sigma rules
        run: sigma check detections/sigma/*.yml

      - name: Sigma -> Splunk conversion smoke test
        run: sigma convert -t splunk --without-pipeline detections/sigma/*.yml
