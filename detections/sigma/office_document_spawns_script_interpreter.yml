title: Office Document Spawning a Script Interpreter - Crimson RAT Macro
id: cd76273c-2d07-4d91-8d42-ba73e559ec37
status: experimental
description: >
  Detects an Office application spawning a script interpreter, consistent with
  malicious-macro delivery of Crimson RAT and related implants by Transparent
  Tribe (APT36).
references:
  - https://www.sohankanna.com/research/transparent-tribe-apt36-the-persistent-threat-to-indian-government-and-defence
author: Sohan Kanna (@sohankanna)
date: 2026-10-16
tags:
  - attack.execution
  - attack.t1059
  - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
    Image|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
      - '\powershell.exe'
      - '\mshta.exe'
      - '\cmd.exe'
  condition: selection
falsepositives:
  - Office automation / enterprise macros that legitimately launch scripts
level: high
