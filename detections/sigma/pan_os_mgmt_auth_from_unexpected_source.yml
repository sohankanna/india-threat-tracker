title: PAN-OS Management Authentication From Unexpected Source
id: b7262907-f6fe-420f-b098-ae8904c8f5fd
status: experimental
description: >
  Detects a successful administrator authentication to the PAN-OS management
  plane from a source that is not an approved jump box / admin allowlist.
  Relevant to CVE-2026-0322 and the broader pattern of PAN-OS management-
  interface abuse, where an authenticated admin session is the precondition
  for exploitation.
references:
  - https://www.sohankanna.com/research/cve-2026-0322-pan-os-management-interface-zero-day-from-admin-login-to-root
  - https://security.paloaltonetworks.com/CVE-2026-0322
author: Sohan Kanna (@sohankanna)
date: 2026-10-16
tags:
  - attack.initial_access
  - attack.t1133
  - attack.credential_access
logsource:
  product: pan_os
detection:
  selection:
    subtype: auth
    event: 'auth-success'
  filter_admin_sources:
    # TUNE: replace with your jump-box / admin allowlist
    src_ip:
      - '10.0.0.0/8'
  condition: selection and not filter_admin_sources
falsepositives:
  - Legitimate admin access from a source not yet added to the allowlist
  - Break-glass access during an incident
level: high
