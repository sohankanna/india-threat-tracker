title: PAN-OS Management Authentication From Unexpected Source
id: b7262907-f6fe-420f-b098-ae8904c8f5fd
status: experimental
description: >
  Detects a successful administrator authentication to the PAN-OS management
  plane from a source outside the approved jump-box / admin allowlist. This is a
  detector for *unexpected management-plane authentication* — it is NOT proof
  that CVE-2026-0322 (or any other vulnerability) was exploited. An authenticated
  admin session is a precondition for that exploitation, so an admin login from
  somewhere it should never come from is worth investigating on its own.
references:
  - https://www.sohankanna.com/research/cve-2026-0322-pan-os-management-interface-zero-day-from-admin-login-to-root
  - https://security.paloaltonetworks.com/CVE-2026-0322
author: Sohan Kanna (@sohankanna)
date: 2026-10-16
modified: 2026-10-20
tags:
  - attack.initial_access
  - attack.t1133
  - attack.credential_access
logsource:
  product: pan_os
detection:
  selection:
    subtype: auth
    event: 'auth-success'
  filter_admin_sources:
    # TUNE: replace with your jump-box / admin allowlist. Uses proper CIDR
    # matching — add each approved network as its own list entry.
    # Field note: PAN-OS SYSTEM auth-success logs carry the source address only
    # inside the description text, as "... From: <address>." Your pipeline must
    # extract it into src_ip; the shipped Splunk, Elastic and Wazuh versions do
    # this extraction themselves (see DATA-SOURCES.md).
    src_ip|cidr:
      - '10.0.0.0/8'
  condition: selection and not filter_admin_sources
falsepositives:
  - Legitimate admin access from a source not yet added to the allowlist
  - Break-glass access during an incident
level: high
