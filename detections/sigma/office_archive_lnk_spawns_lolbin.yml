title: Archive Utility or Explorer Spawning a LOLBin
id: c8b896ee-107a-4dc2-985c-b96cf33f6228
status: experimental
description: >
  Detects an archive utility (7-Zip, WinRAR, WinZip) or Explorer spawning a
  living-off-the-land binary (mshta, powershell, rundll32, cmd). This is the
  execution step seen in SideCopy and Transparent Tribe (APT36) delivery, where
  a user opens an archive and an extracted LNK launches the next stage.

  Scope, stated honestly: this rule's core logic is the archive/Explorer →
  LOLBin parent-child relationship from a SINGLE process-creation event. It does
  NOT, on its own, prove the full ZIP → LNK → payload chain — establishing that
  sequence needs correlation across the archive-extraction, LNK-execution and
  payload events. Treat a hit as "an archive/Explorer launched a LOLBin — go
  look," and use the LNK-in-command-line context as an investigation lead.
references:
  - https://www.sohankanna.com/research/sidecopy-the-apt36-aligned-group-that-copies-sidewinder
  - https://www.sohankanna.com/research/transparent-tribe-apt36-the-persistent-threat-to-indian-government-and-defence
author: Sohan Kanna (@sohankanna)
date: 2026-10-16
modified: 2026-10-20
tags:
  - attack.execution
  - attack.t1204.002
  - attack.t1218.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\7zFM.exe'
      - '\WinRAR.exe'
      - '\Winzip.exe'
  selection_child:
    Image|endswith:
      - '\mshta.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\rundll32.exe'
      - '\cmd.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate shortcuts or archives launching scripts; tune to your environment
  - Admin/scripted workflows that extract archives and run tooling
level: high
