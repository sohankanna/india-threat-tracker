name: Update feeds

on:
  schedule:
    # Twice a day. GitHub often starts scheduled runs hours late; the second run
    # keeps the feed fresh if the first is delayed or fails.
    - cron: "33 2 * * *"    # ~08:03 IST
    - cron: "33 14 * * *"   # ~20:03 IST
  workflow_dispatch: {}      # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch KEV + EPSS, rebuild exploited-cve.json and watchlist.json
        working-directory: scripts
        run: python fetch_exploited.py

      - name: Rebuild IOC exports
        run: python scripts/build_iocs.py

      - name: Validate feeds against schemas
        run: python scripts/validate.py

      - name: Pipeline and IOC export tests
        run: python -m unittest tests.test_pipeline tests.test_iocs

      - name: Generate tweet draft
        working-directory: scripts
        run: python make_tweet_draft.py

      - name: Commit and push
        run: |
          git config user.name "india-threat-tracker-bot"
          git config user.email "actions@github.com"
          git add data/ drafts/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: feed update ($(date -u +%Y-%m-%dT%H:%MZ))"
          # Someone may have pushed while this ran. Rebase onto it and retry,
          # so a concurrent push never costs a day's update.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Could not push the feed update after 3 attempts"
          exit 1
