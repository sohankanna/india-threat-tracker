name: Update feeds

on:
  schedule:
    # Twice a day. GitHub often starts scheduled runs hours late; the second run
    # keeps the feed fresh if the first is delayed or fails.
    - cron: "33 2 * * *"    # ~08:03 IST
    - cron: "33 14 * * *"   # ~20:03 IST
  workflow_dispatch: {}      # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Regenerate, validate, test and push
        # See scripts/publish_update.sh: if someone pushes while this runs, the
        # job resets to their commit and rebuilds; it never resolves a conflict.
        run: |
          git config user.name "india-threat-tracker-bot"
          git config user.email "actions@github.com"
          bash scripts/publish_update.sh
