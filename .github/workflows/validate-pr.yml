name: Validate data + detections

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-ci.txt

      - name: Validate data feeds against schemas
        run: python scripts/validate.py

      - name: IOC exports match the campaign data
        run: python scripts/build_iocs.py --check

      - name: STIX bundle matches the canonical feeds
        run: python scripts/build_stix.py --check

      - name: STIX 2.1 validation (OASIS validator)
        run: stix2_validator data/india-threat-tracker-stix.json

      - name: Detection inventory + YAML/XML parse
        run: python scripts/check_inventory.py

      - name: Tests (pipeline, IOC and STIX exports, detection fixtures)
        run: python -m unittest discover -s tests -v

      - name: Validate Sigma rules
        run: sigma check detections/sigma/*.yml

      - name: Sigma -> Splunk conversion smoke test
        run: sigma convert -t splunk --without-pipeline detections/sigma/*.yml
